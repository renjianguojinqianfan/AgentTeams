[project]
name = "servevo-regression"
version = "0.1.0"
description = "Servevo 回归：50 题测试集 + v1/v2 量化对照（regression-verify Skill 评测入口）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.9",
    "langchain-core>=1.3.13",
    "langchain-openai>=1.3.5",
    "json-repair>=0.61.0",
    "tenacity>=9.0.0",
    "aiofiles>=23.0.0",
]

[project.scripts]
servevo-regression = "servevo_regression.cli:main"

[tool.setuptools.packages.find]
include = ["servevo_regression*"]