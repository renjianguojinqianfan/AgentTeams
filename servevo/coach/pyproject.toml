[project]
name = "servevo-coach"
version = "0.1.0"
description = "Servevo 陪练官：陪练剧本 + 知识修订 + 回归测试（自适应图迁移）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.9",
    "langchain-core>=1.3.13",
    "langchain-openai>=1.3.5",
    "json-repair>=0.61.0",
    "tenacity>=9.0.0",
    "aiofiles>=23.0.0",
]

[project.scripts]
servevo-coach = "servevo_coach.cli:main"

[tool.setuptools.packages.find]
include = ["servevo_coach*"]

[tool.setuptools.package-data]
servevo_coach = ["prompts/*.st"]